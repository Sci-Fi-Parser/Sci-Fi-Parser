# Cross-model VLM comparison.
#
# Each [[model]] entry produces its own benchmark report and contributes one
# row to the leaderboard. `[defaults]` values apply to every model unless the
# entry overrides them.
#
# Run with:  benchmark-compare --config config/vlm_comparison.toml
#
# CLI flags (any flag overrides the [run] field of the same name):
#   --data <dir>        synthetic dataset (images/ + labels.jsonl); req if no [run].data
#   --out <dir>         parent dir; each model gets a subdir + leaderboard.* lives here
#   --seed <int>        scoring seed (default 0)
#   --limit <int>       cap each model to the first N images (smoke runs)
#   --pull {prefetch|circular|skip}
#                       prefetch: pull all missing up front, keep
#                       circular: pull -> run -> rm per model (peak disk small)
#                       skip:     leave missing models as ERROR rows
#                       If omitted and any model is missing, prompts interactively.
#   --yes / -y          skip the "this will pull N model(s)" confirmation prompt.
#                       Required for non-interactive / nohup runs. If you pass --yes
#                       without --pull AND models are missing, the runner errors out
#                       (deliberate footgun guard, no silent downloads).
#   --dry-run           print the preflight (LOCAL/MISSING + sizes + free disk)
#                       and exit -- no benchmark, no pulls.
#   --resume            for each model, if reports/<name>/results.json already
#                       exists, reuse it instead of re-running. Use after a crash
#                       or to add a new model to a config without redoing the
#                       others. Rows that resume print "↺ resumed from ...".
#
# The leaderboard.html / leaderboard.md regenerates after EVERY row, so even
# a crash leaves a usable partial report (kill -TERM is safe).

# Inherit the canonical prompt + tunables from the single-model profile.
# Merge order: dataclass defaults -> this `extends` file -> [defaults] below
# -> per-[[model]] overrides. Set fields in [defaults] only to *differ* from
# vlm.toml across the whole comparison.
extends = "vlm.toml"

[run]
data = "train_data/synthetic"
out  = "reports/comparison"
seed = 0
pull = "circular"   # pull/run/rm per row; peak disk stays small
# limit = 1         # uncomment for a smoke run

# ---------- Models ----------
# Top 3 from the 10-model sweep on the 40-image synthetic dataset, ranked by
# value-accuracy (median per-bar error):
#   qwen2.5vl:7b      (q4) median 0.24%
#   qwen2.5vl:7b-q8_0 (q8) median 0.22%
#   qwen2.5vl:3b           median 0.36%
# All three are sub-1% median; the qwen-3b mean is dominated by an
# occasional 10x-scale misread on the y-axis units, which we expect to fix
# downstream in preprocessing. The other 7 models (moondream, llava-*,
# llava-llama3, llava-phi3, minicpm-v, llama3.2-vision) had value medians
# 30x-1000x worse and are not useful as baselines at this stage.

[[model]]
name = "qwen-3b"
model = "qwen2.5vl:3b"

[[model]]
name = "qwen-7b-q4"
model = "qwen2.5vl:7b"

[[model]]
name = "qwen-7b-q8"
model = "qwen2.5vl:7b-q8_0"
