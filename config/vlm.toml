# VLM extractor profile.
#
# Edit this file to change which model the single-model `benchmark` script
# uses by default. This file holds the *canonical* prompt + tunables; the
# cross-model comparison configs (`vlm_comparison.toml`, `vlm_smoke.toml`)
# inherit from here via `extends = "vlm.toml"`.
#
# Run with:  benchmark --data train_data/synthetic
#
# CLI flags for the `benchmark` script:
#   --data <dir>            REQUIRED: synthetic dataset (images/ + labels.jsonl)
#   --out <dir>             where to write report.html + results.json
#                           (default: reports/<extractor-name>)
#   --extractor <name>      noisy-oracle | ollama | ollama:<tag> | api | api:<tag>
#                           ollama          uses this file's `model` field
#                           ollama:<tag>    overrides just the model tag
#                                           (e.g. ollama:qwen2.5vl:7b-q8_0)
#                           api             OpenAI-compatible chat completions;
#                                           set `backend`/`base_url` below
#                           api:<tag>       same, overriding the model tag
#                           noisy-oracle    in-memory sanity check; no network
#                           Default: noisy-oracle (so a fresh checkout runs).
#   --vlm-config <path>     point at a different profile TOML
#                           (default: config/vlm.toml if present)
#   --seed <int>            RNG seed (default 0); only affects noisy-oracle
#   --limit <int>           cap to the first N images (smoke-testing)
#
# Env-var escape hatches (one-off experiments without editing the file):
#   BENCH_NUM_CTX=4096      overrides `num_ctx` for this run
#   BENCH_NUM_GPU=18        overrides `num_gpu` for this run

model = "qwen2.5vl:7b"
# model = "qwen2.5vl:7b-q8_0"   # higher precision, ~80-100 s/chart on CPU
# model = "qwen2.5vl:7b-fp16"   # full precision, ~150-200 s/chart on CPU
# model = "qwen2.5vl:3b"        # smaller / faster, weak on abbreviated y-axes

num_ctx = 2048
# num_gpu = 18                  # partial GPU offload (ollama may still fall
                                # back to CPU if the working set exceeds VRAM)

# ---- OpenAI-compatible chat-completions backend (the `api` extractor) ----
# Uncomment to point at any OpenAI-compatible server (OpenAI, vLLM, LM Studio,
# llama.cpp). `num_ctx`/`num_gpu` above are ignored by this backend.
# backend = "api"
# base_url = "http://localhost:8080/v1"   # e.g. a local llama.cpp llama-server
# api_key_env = "OPENAI_API_KEY"          # env var holding the key; dummy if unset
# response_format = "json_schema"         # "json_schema" (grammar-constrained,
                                           # best for llama.cpp) | "json_object"

prompt = """Extract the data from this chart.
Rules:
- chart_type: one of bar_chart, grouped_bar_chart, stacked_bar_chart, horizontal_bar_chart, line_chart.
- Use the x-axis category labels EXACTLY as printed. Do not invent dates, years, or names.
- Series naming: if there is a legend, use the legend labels. If there is NO legend (single-series chart), use the y-axis title as the series name. Never leave the name blank.
- Read each y-value from the y-axis scale and the bar / marker height. If numeric labels are printed on the bars, prefer those.
- Watch y-axis units: '200K' = 200000, '1.5M' = 1500000, '2.3B' = 2300000000. Return plain numbers, no suffixes, no extra zeros.
- confidence: a number from 0.0 to 1.0 reflecting how certain you are that the extracted values are correct. Lower it for charts without printed value labels or with hard-to-read axes.
- Do not output series, categories, or values that do not appear on the chart."""
