# Smoke / iteration config -- two already-pulled models, one image each.
#
# Use this to verify wiring changes (preflight, leaderboard, pull modes)
# without burning gigabytes of disk or hours of inference. Inherits prompt
# + tunables from vlm.toml so smoke results predict comparison results.
#
# Run with:  benchmark-compare --config config/vlm_smoke.toml

extends = "vlm.toml"

[run]
data  = "train_data/synthetic"
out   = "reports/smoke"
limit = 1
seed  = 0
pull  = "skip"   # never touch the disk; missing models become ERROR rows.

[[model]]
name = "qwen-7b"
model = "qwen2.5vl:7b"

[[model]]
name = "qwen-3b"
model = "qwen2.5vl:3b"
