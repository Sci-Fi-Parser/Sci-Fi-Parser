[project]
name = "sci-fi-parser"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "ollama>=0.3",
  "pillow>=10.0",
  "pydantic>=2.0",
]
description = "A package to to parse data from graphs in documents."
readme = "README.md"
license = "MIT"

[project.optional-dependencies]
cv = ["opencv-python>=4.10"]

[project.scripts]
benchmark = "sci_fi_parser.accuracy.benchmark:main"
benchmark-compare = "sci_fi_parser.accuracy.vlm_compare:main"
parse-chart = "sci_fi_parser.main:main"
synthetic-bars = "sci_fi_parser.accuracy.synthetic.cli:main"

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Explicit so non-Python assets (e.g. accuracy/assets/*.css, *.js) are
# guaranteed to ship even if hatchling's default file selection changes.
packages = ["src/sci_fi_parser"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pylint (>=4.0.3,<5.0.0)"
]
