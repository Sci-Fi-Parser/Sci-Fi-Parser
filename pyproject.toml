[project]
name = "sci-fi-parser"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "matplotlib>=3.9",
  "httpx>=0.27",
  "pillow>=10.0",
  "pydantic>=2.0",
  "paddleocr>=3.5.0",
  "paddlepaddle==3.2.0",
  "opencv-python>=4.13.0.92",
  "pymupdf>=1.27.2.3",
  "torch>=2.12.0",
  "torchvision>=0.27.0",
  "tqdm>=4.67.3",
  "transformers>=5.12.1",
  "pyarrow>=24.0.0",
]
description = "A package to to parse data from graphs in documents."
readme = "README.md"
license = "MIT"

[project.optional-dependencies]
cv = ["opencv-python>=4.10"]

[project.scripts]
benchmark = "sci_fi_parser.benchmark.benchmark:main"
benchmark-compare = "sci_fi_parser.benchmark.vlm_compare:main"
bench-pipeline = "sci_fi_parser.benchmark.bench_pipeline:main"
parse-chart = "sci_fi_parser.main:main"
synthetic-bars = "scripts.synthetic.cli:main"

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pylint (>=4.0.3,<5.0.0)",
    "autopep8>=2.3.2",
    "coverage>=7.14.1",
    "ruff>=0.15.20",
    "mypy>=2.1.0",
]

[tool.coverage.run]
omit = [
    "config.py",
    "config-3.py",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sci_fi_parser", "scripts"]
