[project]
name = "sci-fi-parser"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "matplotlib>=3.9",
  "httpx>=0.27",
  "pillow>=10.0",
  "pydantic>=2.0",
  "paddleocr>=3.5.0",
  "paddlepaddle==3.2.0",
  "opencv-python>=4.13.0.92",
  "pymupdf>=1.27.2.3",
  "torch>=2.12.0",
  "torchvision>=0.27.0",
  "tqdm>=4.67.3",
  "transformers>=5.12.1",
  "pyarrow>=24.0.0",
  "duckdb>=1.5.4",
  "pandas>=3.0.3",
]
description = "A package to parse data from graphs in documents."
readme = "README.md"
license = "MIT"
license-files = { paths = ["LICENSE"] }

keywords = [
  "scientific figure parser",
  "document parsing",
  "pdf processing",
  "chart extraction",
  "graph extraction",
  "ocr",
  "computer vision",
  "vision-language models",
  "data extraction",
  "scientific documents",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Text Processing :: General",
]

[project.urls]
Repository = "https://github.com/Sci-Fi-Parser/Sci-Fi-Parser"
Issues = "https://github.com/Sci-Fi-Parser/Sci-Fi-Parser/issues"

[project.optional-dependencies]
cv = ["opencv-python>=4.10"]

[project.scripts]
bench-pipeline = "sci_fi_parser.benchmark.bench_pipeline:main"
parse-chart = "sci_fi_parser.main:main"
